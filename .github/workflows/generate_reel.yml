name: Generate AI Reel

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9,17 * * *'

jobs:
  build_video:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت فایل‌های پروژه
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: نصب موتور ویدیو (FFmpeg) و فونت فارسی وزیرمتن
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-hosny-amiri wget unzip fontconfig
          mkdir -p ~/.fonts
          wget -q https://github.com/rastikerdar/vazirmatn/releases/download/v33.003/Vazirmatn-v33.003.zip -O vazir.zip
          unzip -q vazir.zip -d ~/.fonts/
          fc-cache -f -v

      - name: نصب کتابخانه‌های هوش مصنوعی و صدا
        run: |
          pip install google-generativeai edge-tts requests

      - name: ساخت و اجرای اسکریپت ریلز
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python main.py

      - name: آماده‌سازی فایل ویدیوی ریلز و کپشن برای دانلود
        uses: actions/upload-artifact@v4
        with:
          name: generated-reel
          path: |
            final_reel.mp4
            caption.txt
